<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" fill="none">
  <defs>
    <linearGradient id="owl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="272" rx="94" ry="12" fill="#1E1B4B" opacity="0.08"/>

  <!-- sparkles -->
  <g fill="#DB2777" opacity="0.85">
    <path d="M60,74 l5,13 13,5 -13,5 -5,13 -5,-13 -13,-5 13,-5 Z"/>
    <path d="M300,150 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z"/>
    <circle cx="284" cy="66" r="4"/>
    <circle cx="70" cy="182" r="3.5"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="118" y="214" width="128" height="10" rx="4" fill="#1E1B4B" opacity="0.85"/>
    <path d="M130,214 L138,160 A6,6 0 0 1 144,155 L220,155 A6,6 0 0 1 226,160 L234,214 Z"
          fill="#F4F4F7" stroke="#1E1B4B" stroke-width="2.5"/>
    <rect x="146" y="167" width="62" height="5" rx="2.5" fill="#4F46E5" opacity="0.55"/>
    <rect x="146" y="178" width="44" height="5" rx="2.5" fill="#7C3AED" opacity="0.45"/>
    <rect x="146" y="189" width="52" height="5" rx="2.5" fill="#DB2777" opacity="0.4"/>
  </g>

  <!-- owl -->
  <g>
    <path d="M180,80
             C240,80 258,132 254,176
             C251,206 228,228 180,228
             C132,228 109,206 106,176
             C102,132 120,80 180,80 Z"
          fill="url(#owl-body)" stroke="#1E1B4B" stroke-width="2.5"/>

    <!-- wings -->
    <path d="M112,140 C96,160 94,192 112,214 C120,200 122,166 126,146 Z"
          fill="#4F46E5" stroke="#1E1B4B" stroke-width="2"/>
    <path d="M248,140 C264,160 266,192 248,214 C240,200 238,166 234,146 Z"
          fill="#4F46E5" stroke="#1E1B4B" stroke-width="2"/>

    <!-- belly -->
    <path d="M180,124 C210,124 222,156 219,182 C217,202 202,214 180,214
             C158,214 143,202 141,182 C138,156 150,124 180,124 Z"
          fill="#FBF7FF" opacity="0.9"/>
    <path d="M164,168 q16,10 32,0" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
    <path d="M162,186 q18,11 36,0" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>

    <!-- ear tufts -->
    <path d="M132,86 L120,58 L146,74 Z" fill="url(#owl-body)" stroke="#1E1B4B" stroke-width="2.5"/>
    <path d="M228,86 L240,58 L214,74 Z" fill="url(#owl-body)" stroke="#1E1B4B" stroke-width="2.5"/>

    <!-- eyes -->
    <circle cx="156" cy="132" r="19" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2.5"/>
    <circle cx="204" cy="132" r="19" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2.5"/>
    <circle cx="159" cy="134" r="8" fill="#1E1B4B"/>
    <circle cx="207" cy="134" r="8" fill="#1E1B4B"/>
    <circle cx="162" cy="131" r="2.4" fill="#FFFFFF"/>
    <circle cx="210" cy="131" r="2.4" fill="#FFFFFF"/>

    <!-- beak -->
    <path d="M172,148 L188,148 L180,162 Z" fill="#F59E0B" stroke="#1E1B4B" stroke-width="2"/>

    <!-- feet -->
    <path d="M158,226 l-3,14 M164,226 l0,15 M170,226 l3,14"
          stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M190,226 l-3,14 M196,226 l0,15 M202,226 l3,14"
          stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(258,208)">
    <path d="M0,10 h34 l-3,26 a3,3 0 0 1 -3,3 h-22 a3,3 0 0 1 -3,-3 Z"
          fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
    <path d="M34,16 q12,0 8,14 q-3,9 -13,7" fill="none" stroke="#1E1B4B" stroke-width="2"/>
    <path d="M4,10 C4,2 30,2 30,10" fill="none" stroke="#DB2777" stroke-width="3"/>
  </g>
</svg>
