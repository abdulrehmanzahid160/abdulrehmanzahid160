  <g clip-path="url(#clip-hdark)">
    <rect class="sweep" x="0" y="0" width="450" height="2" fill="url(#sweep-hdark)"/>
  </g>
  <style>
    .sweep { animation: sweep-hdark 7s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes sweep-hdark {
      0%   { transform: translateX(-450px); }
      100% { transform: translateX(1000px); }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; opacity: .5; } }
  </style>
  <style>
    .role { opacity: 0; animation: cycle-hdark 14s linear infinite; }
    .r0 { animation-delay: 0s; }  .r1 { animation-delay: 3.5s; }
    .r2 { animation-delay: 7s; }  .r3 { animation-delay: 10.5s; }
    @keyframes cycle-hdark {
      0%    { opacity: 0; transform: translateY(6px); }
      3%    { opacity: 1; transform: translateY(0); }
      22%   { opacity: 1; transform: translateY(0); }
      25%   { opacity: 0; transform: translateY(-6px); }
      100%  { opacity: 0; transform: translateY(-6px); }
    }
    .edge { stroke-dasharray: 10 46; stroke-dashoffset: 56; opacity: .38;
            animation: flow-hdark 3.4s linear infinite; }
    @keyframes flow-hdark { to { stroke-dashoffset: 0; } }
    .node { animation: pulse-hdark 3.4s ease-in-out infinite; }
    @keyframes pulse-hdark {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .role { animation: none; } .r0 { opacity: 1; }
      .edge, .node { animation: none; opacity: .7; }
    }
  </style>
